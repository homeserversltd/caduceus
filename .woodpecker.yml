when:
  event:
    - push


steps:
  - name: registry-pen-caduceus
    image: python:3.12-alpine
    backend_options:
      docker:
        user: "0"
    when:
      - event: push
        branch: main
    environment:
      KETHER_URL:
        from_secret: KETHER_URL
    commands:
      - |
        set -eu
        KETHER_ENDPOINT="${KETHER_URL:-}"
        KETHER_ENDPOINT="${KETHER_ENDPOINT%/}"
        if [ -z "$KETHER_ENDPOINT" ]; then
          KETHER_ENDPOINT="http://192.168.123.1:7100"
        fi
        export KETHER_ENDPOINT
        python3 - <<'PY'
        import http.client
        import json
        import os
        import sys
        import time
        import urllib.error
        import urllib.request

        RETRY_STATUSES = {502, 503, 504}
        MAX_ATTEMPTS = 5
        BACKOFF_SECONDS = (2, 5, 10, 20, 30)

        def post_json_with_retry(url, payload, label):
            data = json.dumps(payload).encode("utf-8")
            last_status = None
            last_raw = b""
            last_error = None
            for attempt in range(1, MAX_ATTEMPTS + 1):
                request = urllib.request.Request(
                    url, data=data, headers={"Content-Type": "application/json"}, method="POST",
                )
                print(f"{label}: attempt {attempt}/{MAX_ATTEMPTS} POST {url}")
                try:
                    with urllib.request.urlopen(request, timeout=1800) as response:
                        status = response.status
                        raw = response.read()
                except urllib.error.HTTPError as exc:
                    status = exc.code
                    raw = exc.read()
                except (urllib.error.URLError, http.client.RemoteDisconnected, TimeoutError, OSError) as exc:
                    status = None
                    raw = b""
                    last_error = str(exc)
                else:
                    last_error = None
                last_status = status
                last_raw = raw
                if status is not None and 200 <= status < 300:
                    return status, raw
                retryable = status in RETRY_STATUSES or status is None
                if not retryable or attempt == MAX_ATTEMPTS:
                    break
                delay = BACKOFF_SECONDS[min(attempt - 1, len(BACKOFF_SECONDS) - 1)]
                print(f"{label}: retrying after {delay}s; last_status={status}; last_error={last_error or ''}")
                time.sleep(delay)
            if last_error:
                print(f"{label}: last_transport_error={last_error}")
            return last_status if last_status is not None else 0, last_raw

        child_repo = "caduceus"
        endpoint = os.environ["KETHER_ENDPOINT"].rstrip("/")
        payload = {
            "child_repo": child_repo,
            "new_head": os.environ.get("CI_COMMIT_SHA", ""),
            "cause": os.environ.get("CI_PIPELINE_URL", ""),
        }
        print(f"{child_repo} registry-pen: POST {endpoint}/v1/registry-pen/stamp")
        status, raw = post_json_with_retry(endpoint + "/v1/registry-pen/stamp", payload, f"{child_repo} registry-pen")
        print(f"{child_repo} registry-pen: http_status={status}")
        if raw:
            print("response_body first 4096 bytes=")
            sys.stdout.write(raw[:4096].decode("utf-8", errors="replace"))
            print()
        if status < 200 or status >= 300:
            raise SystemExit(f"{child_repo} registry-pen: Kether stamp failed with HTTP {status}")
        print(f"{child_repo} registry-pen: stamped by Kether/Azoth blood lane")
        PY

  - name: build-publish-caduceus-package
    image: rust:1-bookworm
    when:
      - event: push
        branch: main
    environment:
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
    commands:
      - |
        set -eu
        command -v curl >/dev/null || { echo "build-publish-caduceus-package: curl is required in rust:1-bookworm" >&2; exit 1; }

        FORGEJO_TOKEN="$(printf '%s' "$${FORGEJO_TOKEN:-}" | tr -d '[:space:]')"
        if [ -z "$FORGEJO_TOKEN" ] && [ -r /mnt/keyexchange/FORGEJO_TOKEN ] && [ -s /mnt/keyexchange/FORGEJO_TOKEN ]; then
          FORGEJO_TOKEN="$(tr -d '[:space:]' < /mnt/keyexchange/FORGEJO_TOKEN)"
        fi
        if [ -z "$FORGEJO_TOKEN" ]; then
          printf '%s\n' "build-publish-caduceus-package: org secret injected empty and /mnt/keyexchange/FORGEJO_TOKEN absent — run keyman transmit forgejo-token --to homeserver-ci-agent" >&2
          exit 1
        fi
        if ! printf "%s" "$${CI_COMMIT_SHA:-}" | grep -Eq "^[0-9a-f]{40}$"; then
          echo "build-publish-caduceus-package: CI_COMMIT_SHA must be a full 40-hex commit SHA" >&2
          exit 1
        fi
        if [ -z "$${CI_PIPELINE_URL:-}" ]; then
          echo "build-publish-caduceus-package: CI_PIPELINE_URL is required" >&2
          exit 1
        fi

        env_sha=$(printf '%s\n%s\n%s\n' "$(rustc -Vv)" "$(cargo -V)" x86_64-unknown-linux-gnu | sha256sum | cut -d' ' -f1)
        CADUCEUS_BUILD_SHA="$CI_COMMIT_SHA" CADUCEUS_BUILD_ENV_SHA="$env_sha" cargo build --release
        binary=target/release/caduceus
        test -f "$binary"
        binary_sha256="$(sha256sum "$binary" | cut -d " " -f 1)"
        built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        printf '{\n  "schema": "estate.artifact.manifest.v1",\n  "component": "caduceus",\n  "source_sha": "%s",\n  "env_sha": "%s",\n  "target": "x86_64-unknown-linux-gnu",\n  "sha256": "%s",\n  "built_at": "%s",\n  "pipeline_url": "%s"\n}\n' \
          "$CI_COMMIT_SHA" "$env_sha" "$binary_sha256" "$built_at" "$CI_PIPELINE_URL" \
          > manifest.json

        package_base="https://git.home.arpa/api/packages/HOMESERVERSLTD/generic/caduceus/$CI_COMMIT_SHA"
        auth_header="Authorization: token $FORGEJO_TOKEN"

        verify_existing_manifest() {
          existing_status="$(curl --silent --show-error \
            --output existing-manifest.json \
            --write-out "%{http_code}" \
            --header "$auth_header" \
            "$package_base/manifest.json")"
          if [ "$existing_status" != "200" ]; then
            echo "build-publish-caduceus-package: collision but existing manifest returned HTTP $existing_status" >&2
            exit 1
          fi
          existing_sha256="$(grep -Eo '"sha256"[[:space:]]*:[[:space:]]*"[0-9a-f]{64}"' existing-manifest.json | grep -Eo '[0-9a-f]{64}' || true)"
          if ! printf "%s" "$existing_sha256" | grep -Eq "^[0-9a-f]{64}$"; then
            echo "build-publish-caduceus-package: existing manifest has no unique 64-hex sha256" >&2
            exit 1
          fi
          if [ "$existing_sha256" != "$binary_sha256" ]; then
            echo "build-publish-caduceus-package: immutable version collision: existing sha256 does not match fresh build" >&2
            exit 1
          fi
          echo "build-publish-caduceus-package: immutable version already exists with matching sha256"
        }

        upload_file() {
          local_path="$1"
          remote_name="$2"
          content_type="$3"
          response_file="upload-$remote_name.response"
          upload_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request PUT \
            --header "$auth_header" \
            --header "Content-Type: $content_type" \
            --upload-file "$local_path" \
            "$package_base/$remote_name")"
          case "$upload_status" in
            200|201|204)
              echo "build-publish-caduceus-package: uploaded $remote_name (HTTP $upload_status)"
              ;;
            409)
              echo "build-publish-caduceus-package: $remote_name already exists; verifying immutable manifest"
              verify_existing_manifest
              ;;
            *)
              echo "build-publish-caduceus-package: upload of $remote_name failed with HTTP $upload_status" >&2
              if [ -s "$response_file" ]; then
                head -c 4096 "$response_file" >&2
                printf "\\n" >&2
              fi
              exit 1
              ;;
          esac
        }

        upload_file "$binary" caduceus application/octet-stream
        upload_file manifest.json manifest.json application/json

  - name: build-caduceus-release
    image: rust:1-bookworm
    when:
      - event: push
        branch: main
    commands:
      - |
        set -eu
        mkdir -p .release
        env_sha=$(printf '%s\n%s\n%s\n' "$(rustc -Vv)" "$(cargo -V)" x86_64-unknown-linux-gnu | sha256sum | cut -d' ' -f1)

        build_profile() {
          profile="$1"
          target_dir=".release/target-$profile"
          rm -rf "$target_dir"
          mkdir -p ".release/$profile"

          CADUCEUS_PROFILE="$profile" CADUCEUS_BUILD_SHA="$CI_COMMIT_SHA" CADUCEUS_BUILD_ENV_SHA="$env_sha" \
            CARGO_TARGET_DIR="$target_dir" cargo build --release
          CADUCEUS_PROFILE="$profile" CARGO_TARGET_DIR="$target_dir" \
            cargo metadata --no-deps --format-version 1 > ".release/$profile/cargo-metadata.json"

          binary="$target_dir/release/caduceus"
          test -f "$binary"
          profile_metadata="$(find "$target_dir/release/build" -type f -readable \
            -path '*/caduceus-*/out/profile_routes.rs' -print)"
          if [ -z "$profile_metadata" ] || [ "$(printf '%s\n' "$profile_metadata" | wc -l | tr -d '[:space:]')" != "1" ]; then
            echo "build-caduceus-release: expected exactly one readable generated profile metadata file for $profile" >&2
            exit 1
          fi
          expected_profile_line="pub const ACTIVE_PROFILE: &str = \"$profile\";"
          active_profile_count="$(grep -Fc 'pub const ACTIVE_PROFILE: &str =' "$profile_metadata" || true)"
          expected_profile_count="$(grep -Fx "$expected_profile_line" "$profile_metadata" | wc -l | tr -d '[:space:]')"
          if [ "$active_profile_count" != "1" ] || [ "$expected_profile_count" != "1" ]; then
            echo "build-caduceus-release: generated profile metadata does not contain exactly one ACTIVE_PROFILE declaration equal to $expected_profile_line" >&2
            exit 1
          fi
          cp "$binary" ".release/caduceus-$profile-x86_64"
        }

        build_profile homeserver
        build_profile homeconsole
        build_profile tv
        build_profile probe

  - name: publish-caduceus-forgejo-release
    image: python:3.12-alpine
    when:
      - event: push
        branch: main
    environment:
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
    commands:
      - |
        set -eu
        python3 - <<'PY'
        import urllib.request

        with urllib.request.urlopen("http://192.168.123.1:7100/v1/trust/ca-bundle") as response:
            ca_bundle = response.read()
        with open("/tmp/house-ca.pem", "wb") as bundle_file:
            bundle_file.write(ca_bundle)
        PY
        test -s /tmp/house-ca.pem
        export SSL_CERT_FILE=/tmp/house-ca.pem
        python3 ci/release-publish.py

  - name: flag-caduceus-release
    image: python:3.12-alpine
    when:
      - event: push
        branch: main
    environment:
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
    commands:
      - python3 ci/release-flag.py --house-ca
  - name: ci-outcome-caduceus
    image: python:3.12-alpine
    backend_options:
      docker:
        user: "0"
    when:
      - status: [success, failure]
        event: push
        branch: main
    environment:
      KETHER_URL:
        from_secret: KETHER_URL
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
    commands:
      - |
        set -eu
        KETHER_ENDPOINT="${KETHER_URL:-}"
        KETHER_ENDPOINT="${KETHER_ENDPOINT%/}"
        if [ -z "$KETHER_ENDPOINT" ]; then
          KETHER_ENDPOINT="http://192.168.123.1:7100"
        fi
        export KETHER_ENDPOINT
        python3 - <<'PY'
        import http.client
        import json
        import os
        import ssl
        import sys
        import tempfile
        import urllib.error
        import urllib.request
        from datetime import datetime, timezone

        CA_URL = "http://192.168.123.1:7100/v1/trust/ca-bundle"
        SEAT_URL = "https://git.home.arpa/HOMESERVERSLTD/fulcrum/raw/branch/main/schema/kether.ci_pipeline_outcome.v1.json"
        OUTCOME_PATH = "/v1/ci/pipeline-outcome"

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                raise urllib.error.URLError("redirect refused")

        def refusal(message):
            print(f"ci-outcome-caduceus: refusal: {message}", file=sys.stderr)

        def load_seat():
            token = os.environ.get("FORGEJO_TOKEN", "")
            ca_path = None
            try:
                with tempfile.NamedTemporaryFile(prefix="kether-ca-", suffix=".pem", delete=False) as ca_file:
                    ca_path = ca_file.name
                    ca_request = urllib.request.Request(CA_URL, method="GET")
                    ca_opener = urllib.request.build_opener(NoRedirect())
                    with ca_opener.open(ca_request, timeout=15) as response:
                        ca_status = response.status
                        ca_raw = response.read()
                    if ca_status < 200 or ca_status >= 300 or not ca_raw:
                        raise RuntimeError(f"CA bundle HTTP {ca_status}")
                    ca_file.write(ca_raw)
                context = ssl.create_default_context(cafile=ca_path)
                opener = urllib.request.build_opener(
                    NoRedirect(), urllib.request.HTTPSHandler(context=context),
                )
                seat_request = urllib.request.Request(
                    SEAT_URL,
                    headers={"Authorization": f"token {token}"},
                    method="GET",
                )
                with opener.open(seat_request, timeout=15) as response:
                    seat_status = response.status
                    seat_raw = response.read()
                if seat_status < 200 or seat_status >= 300:
                    raise RuntimeError(f"seat HTTP {seat_status}")
                try:
                    seat = json.loads(seat_raw)
                except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                    raise RuntimeError("seat invalid JSON") from exc
            finally:
                if ca_path is not None:
                    try:
                        os.unlink(ca_path)
                    except OSError:
                        pass

            if not isinstance(seat, dict) or seat.get("schema") != "kether.ci_pipeline_outcome.v1":
                raise RuntimeError("seat schema != kether.ci_pipeline_outcome.v1")
            report = seat.get("report")
            if not isinstance(report, dict):
                raise RuntimeError("seat report is invalid")
            fields = report.get("fields")
            if not isinstance(fields, dict):
                raise RuntimeError("seat report.fields is invalid")
            schema_field = fields.get("schema")
            if not isinstance(schema_field, dict) or not isinstance(schema_field.get("const"), str):
                raise RuntimeError("seat report.fields.schema.const is invalid")
            if schema_field["const"] != seat["schema"]:
                raise RuntimeError("seat report.fields.schema.const is foreign")
            required = report.get("required")
            if not isinstance(required, list) or not required or any(
                not isinstance(field, str) or not field for field in required
            ):
                raise RuntimeError("seat report.required is invalid")
            return seat, fields, required, opener

        def build_payload(fields, required):
            status_field = fields.get("status")
            status_enum = status_field.get("enum") if isinstance(status_field, dict) else None
            if not isinstance(status_enum, list):
                status_enum = []
            candidate_status = os.environ.get("CI_PIPELINE_STATUS", "")
            status = candidate_status if candidate_status and candidate_status in status_enum else "failure"
            if status not in status_enum:
                raise RuntimeError("seat status enum does not permit failure")
            try:
                pipeline_number = int(os.environ.get("CI_PIPELINE_NUMBER", ""))
            except (TypeError, ValueError) as exc:
                raise RuntimeError("CI_PIPELINE_NUMBER is not an integer") from exc
            payload = {
                "schema": fields["schema"]["const"],
                "repo_locator": "forgejo:HOMESERVERSLTD/caduceus",
                "commit_sha": os.environ.get("CI_COMMIT_SHA", ""),
                "pipeline_number": pipeline_number,
                "status": status,
                "event": os.environ.get("CI_PIPELINE_EVENT", ""),
                "branch": os.environ.get("CI_COMMIT_BRANCH", ""),
                "forge_url": os.environ.get("CI_PIPELINE_FORGE_URL", ""),
                "reporter": "woodpecker",
                "finished_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
            }
            missing = [
                field for field in required
                if field not in payload or payload[field] is None or payload[field] == ""
            ]
            if missing:
                raise RuntimeError("payload missing required fields: " + ", ".join(missing))
            return payload

        def post_outcome(opener, payload):
            endpoint = os.environ["KETHER_ENDPOINT"].rstrip("/") + OUTCOME_PATH
            request = urllib.request.Request(
                endpoint,
                data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                headers={
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
                method="POST",
            )
            try:
                with opener.open(request, timeout=15) as response:
                    status = response.status
                    raw = response.read()
            except urllib.error.HTTPError as exc:
                status = exc.code
                raw = exc.read()
            print(f"ci-outcome-caduceus: http_status={status}")
            print("response_body=")
            sys.stdout.write(raw.decode("utf-8", errors="replace"))
            print()
            if status < 200 or status >= 300:
                refusal(f"POST {endpoint} returned HTTP {status}")

        def main():
            try:
                _seat, fields, required, opener = load_seat()
                payload = build_payload(fields, required)
                post_outcome(opener, payload)
            except (urllib.error.URLError, http.client.RemoteDisconnected, TimeoutError, OSError) as exc:
                refusal(f"transport failure: {exc}")
            except Exception as exc:
                refusal(str(exc))

        main()
        PY
