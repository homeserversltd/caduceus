when:
  event:
    - push


steps:
  - name: registry-pen-caduceus
    image: python:3.12-alpine
    backend_options:
      docker:
        user: "0"
    when:
      - event: push
        branch: main
    environment:
      KETHER_URL:
        from_secret: KETHER_URL
    commands:
      - |
        set -eu
        KETHER_ENDPOINT="${KETHER_URL:-}"
        KETHER_ENDPOINT="${KETHER_ENDPOINT%/}"
        if [ -z "$KETHER_ENDPOINT" ]; then
          KETHER_ENDPOINT="http://192.168.123.1:7100"
        fi
        export KETHER_ENDPOINT
        python3 - <<'PY'
        import http.client
        import json
        import os
        import sys
        import time
        import urllib.error
        import urllib.request

        RETRY_STATUSES = {502, 503, 504}
        MAX_ATTEMPTS = 5
        BACKOFF_SECONDS = (2, 5, 10, 20, 30)

        def post_json_with_retry(url, payload, label):
            data = json.dumps(payload).encode("utf-8")
            last_status = None
            last_raw = b""
            last_error = None
            for attempt in range(1, MAX_ATTEMPTS + 1):
                request = urllib.request.Request(
                    url, data=data, headers={"Content-Type": "application/json"}, method="POST",
                )
                print(f"{label}: attempt {attempt}/{MAX_ATTEMPTS} POST {url}")
                try:
                    with urllib.request.urlopen(request, timeout=1800) as response:
                        status = response.status
                        raw = response.read()
                except urllib.error.HTTPError as exc:
                    status = exc.code
                    raw = exc.read()
                except (urllib.error.URLError, http.client.RemoteDisconnected, TimeoutError, OSError) as exc:
                    status = None
                    raw = b""
                    last_error = str(exc)
                else:
                    last_error = None
                last_status = status
                last_raw = raw
                if status is not None and 200 <= status < 300:
                    return status, raw
                retryable = status in RETRY_STATUSES or status is None
                if not retryable or attempt == MAX_ATTEMPTS:
                    break
                delay = BACKOFF_SECONDS[min(attempt - 1, len(BACKOFF_SECONDS) - 1)]
                print(f"{label}: retrying after {delay}s; last_status={status}; last_error={last_error or ''}")
                time.sleep(delay)
            if last_error:
                print(f"{label}: last_transport_error={last_error}")
            return last_status if last_status is not None else 0, last_raw

        child_repo = "caduceus"
        endpoint = os.environ["KETHER_ENDPOINT"].rstrip("/")
        payload = {
            "child_repo": child_repo,
            "new_head": os.environ.get("CI_COMMIT_SHA", ""),
            "cause": os.environ.get("CI_PIPELINE_URL", ""),
        }
        print(f"{child_repo} registry-pen: POST {endpoint}/v1/registry-pen/stamp")
        status, raw = post_json_with_retry(endpoint + "/v1/registry-pen/stamp", payload, f"{child_repo} registry-pen")
        print(f"{child_repo} registry-pen: http_status={status}")
        if raw:
            print("response_body first 4096 bytes=")
            sys.stdout.write(raw[:4096].decode("utf-8", errors="replace"))
            print()
        if status < 200 or status >= 300:
            raise SystemExit(f"{child_repo} registry-pen: Kether stamp failed with HTTP {status}")
        print(f"{child_repo} registry-pen: stamped by Kether/Azoth blood lane")
        PY

  - name: build-caduceus-release
    image: rust:1-bookworm
    when:
      - event: push
        branch: main
    commands:
      - |
        set -eu
        mkdir -p .release
        cargo metadata --no-deps --format-version 1 > .release/cargo-metadata.json
        CADUCEUS_BUILD_SHA="$CI_COMMIT_SHA" cargo build --release

  - name: publish-caduceus-forgejo-release
    image: python:3.12-alpine
    when:
      - event: push
        branch: main
    environment:
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
    commands:
      - |
        set -eu
        python3 ci/release-publish.py
