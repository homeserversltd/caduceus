[package]
name = "caduceus"
version = "0.1.0"
edition = "2021"
description = "Public appliance-control lever for sovereign HOMESERVER devices"
license = "BUSL-1.1"

[[bin]]
name = "caduceus"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
md5 = "0.7"
base64 = "0.22"
flate2 = "1.1.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
[build-dependencies]
serde_json = "1"
serde_yaml = "0.9"
