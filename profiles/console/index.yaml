schema: caduceus.profile.v1
profile: console
mode: console
harmonia_profile: /etc/harmonia/profiles/homeconsole/index.json
commands:
- hyalos reflect
- hyalos append
- hyalos tail
- help
- identity show
- profile show
- health
- legacy-sbin list
- legacy-sbin show
- network status
- tailscale status
- vpn status
- receipts latest
- receipts ledger
- sync status
- sync now
- update status
- update check
- update now
- update service status
- update service toggle
- gui update now
- settings display read
- settings display mutate
- settings appearance read
- settings appearance mutate
- settings sound read
- settings sound mutate
- settings input read
- settings input mutate
- settings notifications read
- settings notifications mutate
- settings default-apps read
- settings default-apps mutate
- settings datetime read
- settings datetime mutate
- local-ai runtime status
- local-ai runtime check
- local-ai runtime update
- profile module toggle
- staff intent
- cert trust-install
- cert status
- config path
- config show
- config get
- config set
- config patch
- profile sources reseed
services:
  ledger: /var/lib/harmonia/receipts/homeconsole-ledger.jsonl
  update:
    timer: harmonia-homeconsole.timer
    latest_receipt: /var/lib/harmonia/receipts/homeconsole-update-latest/run.json
  sync:
    latest_receipt: /var/lib/harmonia/receipts/homeconsole-sync-latest/run.json
  gui:
    latest_receipt: /var/lib/harmonia/receipts/arcadia-gui-latest/run.json
  local_ai:
    latest_receipt: /var/lib/harmonia/receipts/local-ai-runtime-latest/run.json
harmonia_routes:
