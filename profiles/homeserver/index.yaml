harmonia_routes:
  interactable_list:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - list
    - --json
    raw_json: true
  interactable_run:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - run
    positional: true
    raw_json: true
  update_now:
    bin: /usr/local/bin/harmonia
    args:
    - update
    - --apply
  update_check:
    bin: /usr/local/bin/harmonia
    args:
    - update
