schema: caduceus.profile.v1
profile: homeserver
gui_face: Coronatio
mode: homeserver
# Thyrsus profile routes are derived from the shared routes/thyrsus/* leaves:
# POST propose, POST admit, POST forge-token, GET forge (all under /api/v1/thyrsus).
# The leaves own profile selection and administrative admission, not a copied list.
harmonia_routes:
  interactable_list:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - list
    - --json
    raw_json: true
  interactable_run:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - run
    positional: true
    raw_json: true
  interactable_silence:
    bin: /usr/local/bin/harmonia
    args: [interactable, silence]
    positional: true
    raw_json: true
  interactable_unsilence:
    bin: /usr/local/bin/harmonia
    args: [interactable, unsilence]
    positional: true
    raw_json: true
  update_now:
    bin: /usr/local/bin/harmonia
    args:
    - update
    - --apply
  update_check:
    bin: /usr/local/bin/harmonia
    args:
    - update
sclerites:
- kea
- unbound
- keyman
- nas
- linker
- transmission
- tailscale
