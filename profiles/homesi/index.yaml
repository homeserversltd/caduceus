schema: caduceus.profile.v1
profile: homesi
mode: homesi
harmonia_profile: /etc/harmonia/profiles/homesi/index.json
services:
  update:
    timer: harmonia.timer
    latest_receipt: /var/lib/harmonia/receipts/update-latest/run.json
  local_ai:
    latest_receipt: /var/lib/harmonia/receipts/local-ai-runtime-latest/run.json
harmonia_routes:
  interactable_list:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - list
    - --json
    raw_json: true
  interactable_run:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - run
    positional: true
    raw_json: true
  update_module:
    bin: /usr/local/bin/harmonia
    raw_json: true
  update_now:
    bin: /usr/local/bin/harmonia
    args:
    - update
    - --apply
  update_check:
    bin: /usr/local/bin/harmonia
    args:
    - update
sclerites:
- nmcli
