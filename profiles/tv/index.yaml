schema: caduceus.profile.v1
profile: tv
mode: tv
harmonia_profile: /etc/harmonia/profiles/tv/index.json
planned_capabilities:
- pjlink
commands:
- hyalos reflect
- hyalos append
- hyalos tail
- pjlink devices
- pjlink power status
- pjlink power set
- pjlink scan
- pjlink known-products
- pjlink known add
- pjlink known remove
- settings display read
- settings display mutate
- settings appearance read
- settings appearance mutate
- settings sound read
- settings sound mutate
- settings input read
- settings input mutate
- settings notifications read
- settings notifications mutate
- settings default-apps read
- settings default-apps mutate
- settings datetime read
- settings datetime mutate
- staff intent
- cert trust-install
- cert status
- config path
- config show
- config get
- config set
- config patch
- interactable list
- interactable run
- profile sources reseed
pjlink:
  catalog_path: var/lib/caduceus/pjlink-known-products.jsonl
  devices:
  - id: living-room-tv
    host: 192.168.123.17
    port: 4352
    timeout_ms: 1500
    known_product:
      manufacturer: HOMESERVER
      productName: Living Room TV
      otherInfo: Fixture PJLink display
      class: '1'
harmonia_routes:
  interactable_list:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - list
    - --json
    raw_json: true
  interactable_run:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - run
    positional: true
    raw_json: true
