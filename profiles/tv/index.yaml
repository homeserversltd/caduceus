schema: caduceus.profile.v1
profile: tv
mode: tv
harmonia_profile: /etc/harmonia/profiles/tv/index.json
planned_capabilities:
- pjlink
services:
  update:
    timer: harmonia.timer
pjlink:
  catalog_path: var/lib/caduceus/pjlink-known-products.jsonl
  devices:
  - id: living-room-tv
    host: 192.168.123.17
    port: 4352
    timeout_ms: 1500
    known_product:
      manufacturer: HOMESERVER
      productName: Living Room TV
      otherInfo: Fixture PJLink display
      class: '1'
harmonia_routes:
  interactable_list:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - list
    - --json
    raw_json: true
  interactable_run:
    bin: /usr/local/bin/harmonia
    args:
    - interactable
    - run
    positional: true
    raw_json: true
  update_now:
    bin: /usr/local/bin/harmonia
    args:
    - update
    - --apply
  update_check:
    bin: /usr/local/bin/harmonia
    args:
    - update
sclerites:
- sway
- pactl
- desktop
- nmcli
- gtk4
